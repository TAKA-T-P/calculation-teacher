<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>UI テスト（開発者用）</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #888; }
    iframe { display: block; border: 0; background: #fff; }
    #results { margin: 0; padding: 8px; background: #fff; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <!--
    ゲーム画面の自動操作テスト。tools/test-ui.js がヘッドレスブラウザで開き、結果（JSON）を読み取る。
    ?w=375&h=800   iframe の大きさ（スマートフォン・iPad などの画面幅を再現）
    ?shot=summary  テストではなく、指定した画面状態で止める（スクリーンショット用）
  -->
  <iframe id="frame" title="テスト対象"></iframe>
  <pre id="results"></pre>
  <script src="ui-test.js"></script>
</body>
</html>
